[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "table-recognition-mineru"
version = "0.1.0"
description = "MinerU-based document/table understanding for Genie integration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "loguru>=0.7",
    "PyYAML>=6.0",
    "mineru>=2.0.4",
    "torch>=2.0",
    "transformers>=4.44,<5",
    "shapely>=2.0",
    "pyclipper>=1.3",
    "ftfy>=6.0",
    "ultralytics>=8.0",
]

[project.optional-dependencies]
genie = [
    "pycognaize>=1.4.54",
    "requests",
]
dev = [
    "pytest>=8.0",
    "reportlab>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
